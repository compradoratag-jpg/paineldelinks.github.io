<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Inteligente - Atalhos (Nuvem Google Sheets)</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131c2e;
            --card-border: rgba(255, 255, 255, 0.07);
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --primary: #38bdf8;
            --primary-glow: rgba(56, 189, 248, 0.2);
            --warning: #fbbf24;
            --danger: #f43f5e;
            --shadow: 0 10px 20px -5px rgba(0, 0, 0, 0.3);
        }

        [data-theme="light"] {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --card-border: rgba(0, 0, 0, 0.08);
            --text-main: #0f172a;
            --text-muted: #64748b;
            --primary: #0284c7;
            --primary-glow: rgba(2, 132, 199, 0.2);
            --shadow: 0 10px 20px -5px rgba(0, 0, 0, 0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        
        body { 
            background-color: var(--bg-color); 
            background-image: 
                radial-gradient(at 0% 0%, var(--primary-glow) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(99, 102, 241, 0.05) 0px, transparent 50%);
            background-attachment: fixed;
            color: var(--text-main); 
            padding: 30px 20px 100px 20px; 
            min-height: 100vh;
            transition: background-color 0.3s, color 0.3s;
        }

        .container { max-width: 1200px; margin: 0 auto; }

        header {
            display: flex; justify-content: space-between; align-items: center;
            padding-bottom: 20px; margin-bottom: 20px; border-bottom: 1px solid var(--card-border);
            flex-wrap: wrap; gap: 15px;
        }
        
        body.focus-mode header, 
        body.focus-mode .controls-bar, 
        body.focus-mode .widgets-grid { display: none !important; }

        .exit-focus-btn {
            position: fixed; top: 20px; right: 20px; background: var(--card-bg);
            border: 1px solid var(--primary); color: var(--primary); width: 44px; height: 44px;
            border-radius: 50%; display: none; align-items: center; justify-content: center;
            cursor: pointer; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4); z-index: 10000; transition: all 0.2s;
        }
        .exit-focus-btn:hover { background: var(--primary); color: #0b0f19; transform: scale(1.1); }
        body.focus-mode .exit-focus-btn { display: flex !important; }

        .header-title { display: flex; align-items: center; gap: 12px; }

        .header-icon {
            width: 42px; height: 42px;
            background: linear-gradient(135deg, #0284c7, #6366f1);
            border-radius: 10px; display: flex; align-items: center; justify-content: center;
            font-size: 18px; color: #fff; box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
        }

        header h1 { font-size: 22px; font-weight: 700; color: var(--text-main); letter-spacing: -0.3px; }
        header p { color: var(--text-muted); font-size: 13px; margin-top: 2px; }

        .header-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

        .sync-badge {
            font-size: 11px; font-weight: 600; padding: 6px 12px; border-radius: 20px;
            background: rgba(56, 189, 248, 0.1); color: var(--primary); border: 1px solid var(--primary-glow);
            display: flex; align-items: center; gap: 6px;
        }

        .btn-action-icon {
            background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text-main);
            width: 40px; height: 40px; border-radius: 8px; display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.2s; position: relative;
        }
        .btn-action-icon:hover { border-color: var(--primary); color: var(--primary); }

        .btn-add {
            background: linear-gradient(135deg, #38bdf8, #6366f1); color: white; border: none;
            padding: 10px 18px; border-radius: 8px; font-weight: 600; font-size: 13px; cursor: pointer;
            display: flex; align-items: center; gap: 8px; box-shadow: 0 4px 15px rgba(56, 189, 248, 0.25);
            transition: all 0.2s ease;
        }
        .btn-add:hover { transform: translateY(-1px); filter: brightness(1.1); }

        /* Widgets superiores */
        .widgets-grid { display: grid; grid-template-columns: 1fr 2fr; gap: 20px; margin-bottom: 25px; transition: all 0.3s ease; }
        @media(max-width: 768px) { .widgets-grid { grid-template-columns: 1fr; } }

        .widget-card {
            background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px;
            padding: 16px; box-shadow: var(--shadow); display: flex; flex-direction: column; justify-content: space-between;
        }
        .widget-clock { font-size: 24px; font-weight: 700; color: var(--primary); letter-spacing: -0.5px; }
        .widget-date { font-size: 12px; color: var(--text-muted); text-transform: capitalize; margin-top: 4px; }
        
        .notes-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; flex-wrap: wrap; gap: 8px; }
        .notes-tabs { display: flex; gap: 6px; overflow-x: auto; max-width: 60%; padding-bottom: 2px; }
        .notes-tab-btn {
            background: var(--bg-color); border: 1px solid var(--card-border); color: var(--text-muted);
            padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: all 0.2s;
        }
        .notes-tab-btn.active { background: var(--primary); color: #0b0f19; border-color: var(--primary); font-weight: 700; }

        .notes-actions { display: flex; gap: 5px; align-items: center; }
        .notes-btn-mini {
            background: var(--bg-color); border: 1px solid var(--card-border); color: var(--text-muted);
            width: 24px; height: 24px; border-radius: 6px; display: flex; align-items: center; justify-content: center;
            font-size: 10px; cursor: pointer; transition: all 0.2s;
        }
        .notes-btn-mini:hover { border-color: var(--primary); color: var(--primary); }
        .notes-btn-delete:hover { border-color: var(--danger); color: var(--danger); }

        .widget-notes textarea {
            width: 100%; height: 95px; background: var(--bg-color); border: 1px solid var(--card-border);
            border-radius: 8px; color: var(--text-main); padding: 8px 12px; font-size: 12px; resize: none; outline: none;
        }

        .checklist-container {
            width: 100%; height: 95px; background: var(--bg-color); border: 1px solid var(--card-border);
            border-radius: 8px; padding: 6px 10px; overflow-y: auto; font-size: 12px; display: none; flex-direction: column; gap: 4px;
        }
        .checklist-item { display: flex; align-items: center; gap: 8px; color: var(--text-main); }
        .checklist-item input[type="checkbox"] { accent-color: var(--primary); width: 14px; height: 14px; cursor: pointer; }
        .checklist-item.completed span { text-decoration: line-through; color: var(--text-muted); }
        .checklist-input-row { display: flex; gap: 6px; margin-top: 6px; }
        .checklist-input-row input { flex: 1; padding: 4px 8px; font-size: 11px; background: var(--card-bg); }
        .checklist-input-row button { padding: 4px 10px; font-size: 11px; background: var(--primary); color: #0b0f19; border: none; border-radius: 6px; font-weight: 700; cursor: pointer; }

        /* Tela PIN */
        .pin-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-color);
            z-index: 99999; display: none; justify-content: center; align-items: center; flex-direction: column; backdrop-filter: blur(10px);
        }
        .pin-box { background: var(--card-bg); border: 1px solid var(--card-border); padding: 30px; border-radius: 16px; text-align: center; max-width: 340px; width: 90%; }
        .pin-dots { display: flex; justify-content: center; gap: 12px; margin: 20px 0; }
        .pin-dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--primary); background: transparent; }
        .pin-dot.filled { background: var(--primary); }
        .pin-keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .pin-key { background: var(--bg-color); border: 1px solid var(--card-border); color: var(--text-main); padding: 14px; font-size: 16px; font-weight: 700; border-radius: 8px; cursor: pointer; }
        .pin-key:hover { background: var(--primary); color: #0b0f19; border-color: var(--primary); }

        /* Kanban */
        .kanban-board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; align-items: start; }
        @media(max-width: 900px) { .kanban-board { grid-template-columns: 1fr; } }
        .kanban-column { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 16px; min-height: 400px; }
        .kanban-col-header { font-size: 14px; font-weight: 700; margin-bottom: 15px; padding-bottom: 8px; border-bottom: 2px solid var(--primary); display: flex; justify-content: space-between; align-items: center; }
        .kanban-col-items { display: flex; flex-direction: column; gap: 12px; min-height: 300px; }

        /* Dock */
        .quick-dock { position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%); background: var(--card-bg); border: 1px solid var(--card-border); backdrop-filter: blur(12px); padding: 10px 20px; border-radius: 30px; display: flex; align-items: center; gap: 12px; box-shadow: 0 15px 30px rgba(0,0,0,0.4); z-index: 999; max-width: 90%; overflow-x: auto; }
        .dock-title { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; border-right: 1px solid var(--card-border); padding-right: 12px; }
        .dock-items { display: flex; gap: 10px; align-items: center; }
        .dock-item { background: var(--bg-color); border: 1px solid var(--card-border); padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; color: var(--text-main); text-decoration: none; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
        .dock-item:hover { border-color: var(--primary); color: var(--primary); }

        /* Modais */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); display: none; justify-content: center; align-items: center; z-index: 9999; }
        .modal-card { background: var(--card-bg); border: 1px solid var(--card-border); width: 100%; max-width: 450px; border-radius: 14px; padding: 24px; box-shadow: 0 25px 50px rgba(0,0,0,0.5); }

        /* Filtros e Busca */
        .controls-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; gap: 15px; flex-wrap: wrap; }
        .category-tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 5px; }
        .tab-btn { background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text-muted); padding: 7px 14px; border-radius: 20px; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; }
        .tab-btn.active { background: var(--primary); color: #0b0f19; border-color: var(--primary); font-weight: 700; }

        .search-box { position: relative; flex: 1; min-width: 240px; }
        .search-box i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 13px; }
        .search-box input { width: 100%; padding: 10px 14px 10px 38px; background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 8px; font-size: 13px; color: var(--text-main); outline: none; }

        /* Form */
        .form-container { background: var(--card-bg); border: 1px solid rgba(56, 189, 248, 0.2); border-radius: 12px; padding: 20px; margin-bottom: 25px; display: none; }
        .form-title { font-size: 16px; font-weight: 600; margin-bottom: 14px; color: var(--primary); display: flex; align-items: center; gap: 8px; }
        .form-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
        @media(min-width: 768px) { .form-grid { grid-template-columns: 2fr 1fr 1fr; } }

        input, select { width: 100%; padding: 11px 14px; background: var(--bg-color); border: 1px solid var(--card-border); border-radius: 8px; color: var(--text-main); font-size: 13px; outline: none; }

        .form-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 14px; }
        .btn-cancel { background: transparent; border: 1px solid var(--card-border); color: var(--text-muted); padding: 8px 16px; border-radius: 6px; cursor: pointer; }
        .btn-save { background: var(--primary); color: #0b0f19; border: none; padding: 8px 18px; border-radius: 6px; font-weight: 700; cursor: pointer; }

        /* Grid */
        .section-container { margin-bottom: 30px; }
        .section-header { font-size: 16px; font-weight: 700; color: var(--text-main); margin-bottom: 15px; display: flex; align-items: center; justify-content: space-between; border-left: 3px solid var(--primary); padding-left: 10px; cursor: pointer; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 18px; }

        .card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 16px; position: relative; display: flex; flex-direction: column; justify-content: space-between; height: 185px; cursor: grab; }
        .card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; }
        .card.card-sheet::before { background: #4ade80; }
        .card.card-doc::before { background: #60a5fa; }
        .card.card-slides::before { background: #fbbf24; }
        .card.card-folder::before { background: #c084fc; }
        .card.card-generic::before { background: #94a3b8; }

        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .card-actions-top { display: flex; align-items: center; gap: 4px; }
        .type-badge { font-size: 10px; font-weight: 700; padding: 3px 9px; border-radius: 20px; text-transform: uppercase; display: inline-flex; align-items: center; gap: 5px; }
        .type-sheet { background: rgba(34, 197, 94, 0.12); color: #22c55e; }
        .type-doc { background: rgba(59, 130, 246, 0.12); color: #3b82f6; }
        .type-slides { background: rgba(245, 158, 11, 0.12); color: #d97706; }
        .type-folder { background: rgba(168, 85, 247, 0.12); color: #9333ea; }
        .type-generic { background: rgba(148, 163, 184, 0.12); color: #64748b; }

        .custom-tag { font-size: 9px; font-weight: 600; padding: 2px 7px; border-radius: 4px; background: rgba(56, 189, 248, 0.15); color: var(--primary); margin-bottom: 6px; display: inline-block; cursor: pointer; }

        .icon-btn { background: transparent; border: none; color: var(--text-muted); width: 24px; height: 24px; border-radius: 4px; cursor: pointer; font-size: 11px; display: flex; align-items: center; justify-content: center; }
        .icon-btn.btn-star.favorited { color: var(--warning); }
        .icon-btn.btn-delete:hover { color: var(--danger); }

        .card-title { font-size: 14px; font-weight: 700; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-desc { font-size: 12px; color: var(--text-muted); height: 34px; overflow: hidden; }

        .card-btn { display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; padding: 9px; background: var(--bg-color); border: 1px solid var(--card-border); color: var(--text-main); text-decoration: none; border-radius: 8px; font-size: 12px; font-weight: 600; }
        .card-btn:hover { background: var(--primary); color: #0b0f19; }

        .command-palette-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; justify-content: center; padding-top: 100px; z-index: 9999; }
        .command-palette { background: var(--card-bg); border: 1px solid var(--primary); width: 100%; max-width: 600px; border-radius: 12px; overflow: hidden; }
        .command-input { width: 100%; padding: 16px; background: transparent; border: none; color: var(--text-main); font-size: 16px; outline: none; }
        .command-results { max-height: 300px; overflow-y: auto; padding: 8px; }
        .command-item { padding: 10px 14px; border-radius: 8px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; color: var(--text-main); font-size: 13px; }
        .command-item:hover { background: rgba(56, 189, 248, 0.15); color: var(--primary); }
    </style>
</head>
<body data-theme="dark">

    <input type="file" id="importFile" style="display: none;" accept=".json" onchange="importBackup(event)">

    <!-- Tela PIN -->
    <div class="pin-screen" id="pinScreen">
        <div class="pin-box">
            <div style="font-size: 18px; font-weight: 700; color: var(--primary); margin-bottom: 6px;"><i class="fa-solid fa-lock"></i> Painel Protegido</div>
            <p style="font-size: 12px; color: var(--text-muted);">Digite o PIN numérico para desbloquear</p>
            <div class="pin-dots">
                <div class="pin-dot" id="dot0"></div>
                <div class="pin-dot" id="dot1"></div>
                <div class="pin-dot" id="dot2"></div>
                <div class="pin-dot" id="dot3"></div>
            </div>
            <div class="pin-keypad">
                <button class="pin-key" onclick="pressPin('1')">1</button>
                <button class="pin-key" onclick="pressPin('2')">2</button>
                <button class="pin-key" onclick="pressPin('3')">3</button>
                <button class="pin-key" onclick="pressPin('4')">4</button>
                <button class="pin-key" onclick="pressPin('5')">5</button>
                <button class="pin-key" onclick="pressPin('6')">6</button>
                <button class="pin-key" onclick="pressPin('7')">7</button>
                <button class="pin-key" onclick="pressPin('8')">8</button>
                <button class="pin-key" onclick="pressPin('9')">9</button>
                <button class="pin-key" onclick="clearPin()" style="font-size:12px;">Limpar</button>
                <button class="pin-key" onclick="pressPin('0')">0</button>
                <button class="pin-key" onclick="backspacePin()" style="font-size:12px;"><i class="fa-solid fa-delete-left"></i></button>
            </div>
            <div id="pinMsg" style="font-size: 11px; color: var(--danger); margin-top: 10px; height: 15px;"></div>
        </div>
    </div>

    <button class="exit-focus-btn" onclick="toggleFocusMode()"><i class="fa-solid fa-compress"></i></button>

    <!-- Command Palette -->
    <div class="command-palette-overlay" id="cmdOverlay" onclick="closeCommandPalette(event)">
        <div class="command-palette" onclick="event.stopPropagation()">
            <input type="text" class="command-input" id="cmdInput" placeholder="Pesquisar atalho... (Ctrl+K)" oninput="renderCommandResults()">
            <div class="command-results" id="cmdResults"></div>
        </div>
    </div>

    <div class="container">
        <header>
            <div class="header-title">
                <div class="header-icon"><i class="fa-solid fa-layer-group"></i></div>
                <div>
                    <h1>Painel de Atalhos</h1>
                    <p>Produtividade e Acesso Rápido (<kbd style="font-size:10px; background:var(--card-border); padding:2px 5px; border-radius:4px;">Ctrl+K</kbd>)</p>
                </div>
            </div>
            <div class="header-actions">
                <div class="sync-badge" id="syncStatus"><i class="fa-solid fa-cloud"></i> Google Sheets Conectado</div>
                <button class="btn-action-icon" onclick="fetchFromGoogleSheets()" title="Forçar Sincronização com Nuvem"><i class="fa-solid fa-arrows-rotate"></i></button>
                <button class="btn-action-icon" onclick="togglePinConfigModal()" title="Configurar Senha PIN"><i class="fa-solid fa-shield-halved"></i></button>
                <button class="btn-action-icon" id="focusModeBtn" onclick="toggleFocusMode()" title="Modo Foco"><i class="fa-solid fa-expand"></i></button>
                <button class="btn-action-icon" id="themeToggleBtn" onclick="toggleTheme()"><i class="fa-solid fa-moon" id="themeIcon"></i></button>
                <button class="btn-action-icon" onclick="exportBackup()"><i class="fa-solid fa-download"></i></button>
                <button class="btn-action-icon" onclick="document.getElementById('importFile').click()"><i class="fa-solid fa-upload"></i></button>
                <button class="btn-add" onclick="toggleForm('addForm')"><i class="fa-solid fa-plus"></i> Novo Atalho</button>
            </div>
        </header>

        <!-- Widgets -->
        <div class="widgets-grid">
            <div class="widget-card">
                <div>
                    <div class="widget-clock" id="liveClock">00:00:00</div>
                    <div class="widget-date" id="liveDate">Carregando...</div>
                </div>
                <div style="font-size: 11px; color: var(--text-muted); margin-top: 10px;"><i class="fa-solid fa-clock"></i> Hora local</div>
            </div>
            
            <div class="widget-card widget-notes">
                <div class="notes-header">
                    <div class="notes-tabs" id="notesTabs"></div>
                    <div class="notes-actions">
                        <button class="notes-btn-mini" onclick="exportCurrentNoteTxt()"><i class="fa-solid fa-file-arrow-down"></i></button>
                        <button class="notes-btn-mini" onclick="toggleNoteMode()"><i class="fa-solid fa-list-check" id="noteModeIcon"></i></button>
                        <button class="notes-btn-mini" onclick="addNoteModule()"><i class="fa-solid fa-plus"></i></button>
                        <button class="notes-btn-mini notes-btn-delete" onclick="deleteCurrentNoteModule()"><i class="fa-solid fa-trash-can"></i></button>
                    </div>
                </div>
                <textarea id="quickNotes" placeholder="Escreva observações para este módulo..." oninput="saveCurrentNote()"></textarea>
                <div class="checklist-container" id="checklistContainer">
                    <div id="checklistItemsList"></div>
                    <div class="checklist-input-row">
                        <input type="text" id="newChecklistItemText" placeholder="Adicionar tarefa..." onkeypress="if(event.key==='Enter') addChecklistItem()">
                        <button onclick="addChecklistItem()">Adicionar</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Form Add/Edit -->
        <div class="form-container" id="addForm">
            <div class="form-title"><i class="fa-solid fa-link"></i> Adicionar Novo Atalho</div>
            <div class="form-grid">
                <input type="text" id="driveUrl" placeholder="Cole o link aqui (https://...)">
                <input type="text" id="fileTitle" placeholder="Título (Opcional)">
                <input type="text" id="fileEmoji" placeholder="Emoji (Ex: 🚀, 📊)" maxlength="2">
            </div>
            <div class="form-grid" style="margin-top: 10px;">
                <input type="text" id="fileSection" placeholder="Seção / Pasta" list="sectionList">
                <datalist id="sectionList"><option value="Geral"></option><option value="Trabalho"></option><option value="Estoque"></option></datalist>
                <input type="text" id="fileDesc" placeholder="Breve descrição...">
                <input type="text" id="fileTag" placeholder="Tag customizada">
            </div>
            <div class="form-actions">
                <button class="btn-cancel" onclick="toggleForm('addForm')">Cancelar</button>
                <button class="btn-save" onclick="saveShortcut()">Salvar</button>
            </div>
        </div>

        <div class="form-container" id="editForm">
            <div class="form-title"><i class="fa-solid fa-pen-to-square"></i> Editar Atalho</div>
            <input type="hidden" id="editId">
            <div class="form-grid">
                <input type="text" id="editUrl" placeholder="Cole o link aqui...">
                <input type="text" id="editTitle" placeholder="Título...">
                <input type="text" id="editEmoji" placeholder="Emoji" maxlength="2">
            </div>
            <div class="form-grid" style="margin-top: 10px;">
                <input type="text" id="editSection" placeholder="Seção / Pasta...">
                <input type="text" id="editDesc" placeholder="Descrição...">
                <input type="text" id="editTag" placeholder="Tag customizada...">
            </div>
            <div class="form-actions">
                <button class="btn-cancel" onclick="toggleForm('editForm')">Cancelar</button>
                <button class="btn-save" onclick="updateShortcut()">Atualizar</button>
            </div>
        </div>

        <!-- Filtros -->
        <div class="controls-bar">
            <div class="category-tabs" id="categoryTabs">
                <button class="tab-btn active" onclick="filterCategory('all', this)">Todos</button>
                <button class="tab-btn" onclick="filterCategory('popular', this)"><i class="fa-solid fa-fire"></i> Mais Acessados</button>
                <button class="tab-btn" onclick="filterCategory('kanban', this)"><i class="fa-solid fa-columns"></i> Kanban (Urgência)</button>
            </div>
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="Pesquisar atalhos... (Ctrl+K)" onkeyup="renderContent()">
            </div>
        </div>

        <div id="mainContainer"></div>
    </div>

    <!-- Dock -->
    <div class="quick-dock" id="quickDock" style="display: none;">
        <span class="dock-title"><i class="fa-solid fa-star" style="color:var(--warning)"></i> Favoritos</span>
        <div class="dock-items" id="dockItems"></div>
    </div>

    <script>
        // =========================================================================
        // COLE O URL DO SEU GOOGLE APPS SCRIPT NA VARIÁVEL ABAIXO:
        // =========================================================================
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx47fIC-Cb4mtTeFk6B9RZZOYZLakLKS1ZW35plNeoGqZBusaL4mEQKpti4DOGWPRJt/exec";

        let shortcuts = JSON.parse(localStorage.getItem('drive_shortcuts')) || [];
        let sectionOrder = JSON.parse(localStorage.getItem('section_order')) || [];
        let currentCategory = 'all';
        let draggedIndex = null;
        let collapsedSections = JSON.parse(localStorage.getItem('collapsed_sections')) || {};
        let isFocusMode = false;

        // Fetch inicial do Google Sheets
        async function fetchFromGoogleSheets() {
            if (!GOOGLE_SCRIPT_URL || GOOGLE_SCRIPT_URL.includes("SEU_URL_DO_GOOGLE_APPS_SCRIPT_AQUI")) {
                document.getElementById('syncStatus').innerHTML = '<i class="fa-solid fa-hard-drive"></i> Modo Local (Configure o Script)';
                return;
            }

            document.getElementById('syncStatus').innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Sincronizando...';
            try {
                const res = await fetch(GOOGLE_SCRIPT_URL);
                const data = await res.json();
                if (Array.isArray(data) && data.length > 0) {
                    shortcuts = data;
                    localStorage.setItem('drive_shortcuts', JSON.stringify(shortcuts));
                    renderContent();
                    document.getElementById('syncStatus').innerHTML = '<i class="fa-solid fa-cloud-check" style="color:#4ade80;"></i> Sincronizado com Nuvem';
                } else if (shortcuts.length > 0) {
                    // Se a planilha estiver vazia, envia os dados locais
                    syncToGoogleSheets();
                }
            } catch (err) {
                console.error(err);
                document.getElementById('syncStatus').innerHTML = '<i class="fa-solid fa-triangle-exclamation" style="color:var(--warning)"></i> Off-line (Modo Local)';
            }
        }
async function syncToGoogleSheets() {

    localStorage.setItem(
        'drive_shortcuts',
        JSON.stringify(shortcuts)
    );

    if (!GOOGLE_SCRIPT_URL) return;

    document.getElementById('syncStatus').innerHTML =
        '<i class="fa-solid fa-spinner fa-spin"></i> Salvando na nuvem...';

    try {

        await fetch(
            GOOGLE_SCRIPT_URL,
            {
                method: 'POST',
                mode: 'no-cors',
                headers: {
                    'Content-Type': 'text/plain'
                },
                body: JSON.stringify({
                    action: 'SYNC_ALL',
                    data: shortcuts
                })
            }
        );

        document.getElementById('syncStatus').innerHTML =
            '<i class="fa-solid fa-cloud-check" style="color:#4ade80;"></i> Salvo na Nuvem';

    } catch (err) {

        console.error(err);

        document.getElementById('syncStatus').innerHTML =
            '<i class="fa-solid fa-circle-exclamation" style="color:red;"></i> Erro ao Salvar';

    }
}

        // Sistema de PIN
        let storedPin = localStorage.getItem('dashboard_pin') || '';
        let enteredPin = '';
        if (storedPin && storedPin.length === 4) document.getElementById('pinScreen').style.display = 'flex';

        function pressPin(d) {
            if (enteredPin.length < 4) {
                enteredPin += d; updatePinDots();
                if (enteredPin.length === 4) {
                    if (enteredPin === storedPin) { document.getElementById('pinScreen').style.display = 'none'; enteredPin = ''; }
                    else { document.getElementById('pinMsg').innerText = 'PIN Incorreto'; setTimeout(() => { enteredPin = ''; updatePinDots(); document.getElementById('pinMsg').innerText = ''; }, 1000); }
                }
            }
        }
        function clearPin() { enteredPin = ''; updatePinDots(); }
        function backspacePin() { enteredPin = enteredPin.slice(0, -1); updatePinDots(); }
        function updatePinDots() { for (let i = 0; i < 4; i++) document.getElementById(`dot${i}`).classList.toggle('filled', i < enteredPin.length); }

        // Módulos de Notas
        let noteModules = JSON.parse(localStorage.getItem('dashboard_note_modules')) || { "Geral": { mode: "text", content: "", checklist: [] } };
        let currentNoteModule = localStorage.getItem('dashboard_current_note_module') || Object.keys(noteModules)[0];

        renderNotesTabs();
        fetchFromGoogleSheets();

        setInterval(() => {
            const now = new Date();
            document.getElementById('liveClock').innerText = now.toLocaleTimeString();
            document.getElementById('liveDate').innerText = now.toLocaleDateString('pt-BR', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        }, 1000);

        function renderNotesTabs() {
            const tabs = document.getElementById('notesTabs'); tabs.innerHTML = '';
            if (!noteModules[currentNoteModule]) currentNoteModule = Object.keys(noteModules)[0] || 'Geral';
            Object.keys(noteModules).forEach(m => {
                const btn = document.createElement('button');
                btn.className = `notes-tab-btn ${m === currentNoteModule ? 'active' : ''}`;
                btn.innerText = m; btn.onclick = () => { currentNoteModule = m; localStorage.setItem('dashboard_current_note_module', m); renderNotesTabs(); };
                tabs.appendChild(btn);
            });
            const mod = noteModules[currentNoteModule];
            document.getElementById('quickNotes').value = mod.content || '';
        }

        function saveCurrentNote() {
            if (noteModules[currentNoteModule]) {
                noteModules[currentNoteModule].content = document.getElementById('quickNotes').value;
                localStorage.setItem('dashboard_note_modules', JSON.stringify(noteModules));
            }
        }

        function saveShortcut() {
            const url = document.getElementById('driveUrl').value.trim();
            let title = document.getElementById('fileTitle').value.trim();
            const desc = document.getElementById('fileDesc').value.trim();
            const section = document.getElementById('fileSection').value.trim() || 'Geral';
            const tag = document.getElementById('fileTag').value.trim();
            const emoji = document.getElementById('fileEmoji').value.trim();

            if (!url) return alert('Insira um link.');
            const type = detectDriveFileType(url);
            if (!title) title = `${getTypeDetails(type).label} sem título`;

            shortcuts.unshift({ id: Date.now(), title, desc, url, type, section, tag, emoji, clicks: 0, favorite: false, urgency: 'medium' });
            syncToGoogleSheets();
            toggleForm('addForm');
            renderContent();
        }

        function updateShortcut() {
            const id = Number(document.getElementById('editId').value);
            const url = document.getElementById('editUrl').value.trim();
            let title = document.getElementById('editTitle').value.trim();
            const desc = document.getElementById('editDesc').value.trim();
            const section = document.getElementById('editSection').value.trim() || 'Geral';
            const tag = document.getElementById('editTag').value.trim();
            const emoji = document.getElementById('editEmoji').value.trim();

            const idx = shortcuts.findIndex(s => s.id === id);
            if (idx !== -1) {
                shortcuts[idx] = { ...shortcuts[idx], url, title, desc, type: detectDriveFileType(url), section, tag, emoji };
                syncToGoogleSheets();
                toggleForm('editForm');
                renderContent();
            }
        }

        function deleteShortcut(id) {
            if (confirm('Remover atalho?')) {
                shortcuts = shortcuts.filter(s => s.id !== id);
                syncToGoogleSheets();
                renderContent();
            }
        }

        function toggleFavorite(id) {
            const item = shortcuts.find(s => s.id === id);
            if (item) { item.favorite = !item.favorite; syncToGoogleSheets(); renderContent(); }
        }

        function detectDriveFileType(url) {
            if (url.includes('/spreadsheets/')) return 'sheet';
            if (url.includes('/document/')) return 'doc';
            if (url.includes('/presentation/')) return 'slides';
            if (url.includes('/folders/')) return 'folder';
            return 'generic';
        }

        function getTypeDetails(type) {
            switch(type) {
                case 'sheet': return { label: 'Planilha', icon: 'fa-file-excel', class: 'type-sheet', cardClass: 'card-sheet' };
                case 'doc': return { label: 'Documento', icon: 'fa-file-word', class: 'type-doc', cardClass: 'card-doc' };
                case 'slides': return { label: 'Apresentação', icon: 'fa-file-powerpoint', class: 'type-slides', cardClass: 'card-slides' };
                case 'folder': return { label: 'Pasta', icon: 'fa-folder-open', class: 'type-folder', cardClass: 'card-folder' };
                default: return { label: 'Link Web', icon: 'fa-globe', class: 'type-generic', cardClass: 'card-generic' };
            }
        }

        function renderCardHTML(item, idx) {
            const details = getTypeDetails(item.type);
            return `
                <div class="card ${details.cardClass}">
                    <div>
                        <div class="card-header">
                            <span class="type-badge ${details.class}"><i class="fa-solid ${details.icon}"></i> ${details.label}</span>
                            <div class="card-actions-top">
                                <button class="icon-btn btn-star ${item.favorite ? 'favorited' : ''}" onclick="toggleFavorite(${item.id})"><i class="fa-solid fa-star"></i></button>
                                <button class="icon-btn btn-delete" onclick="deleteShortcut(${item.id})"><i class="fa-solid fa-trash-can"></i></button>
                            </div>
                        </div>
                        <div class="card-title">${item.emoji ? item.emoji + ' ' : ''}${item.title}</div>
                        <div class="card-desc">${item.desc || ''}</div>
                    </div>
                    <a href="${item.url}" target="_blank" class="card-btn" onclick="recordClick(${item.id})">Acessar</a>
                </div>
            `;
        }

        function recordClick(id) {
            const item = shortcuts.find(s => s.id === id);
            if (item) { item.clicks = (item.clicks || 0) + 1; syncToGoogleSheets(); }
        }

        function renderContent() {
            const container = document.getElementById('mainContainer');
            if (shortcuts.length === 0) {
                container.innerHTML = '<p style="color:var(--text-muted); text-align:center; padding:50px;">Nenhum atalho na nuvem ou local.</p>';
                return;
            }

            const sectionsMap = {};
            shortcuts.forEach(item => {
                const sec = item.section || 'Geral';
                if (!sectionsMap[sec]) sectionsMap[sec] = [];
                sectionsMap[sec].push(item);
            });

            container.innerHTML = '';
            Object.keys(sectionsMap).forEach(sec => {
                const items = sectionsMap[sec];
                const secDiv = document.createElement('div');
                secDiv.className = 'section-container';
                secDiv.innerHTML = `<div class="section-header"><span><i class="fa-solid fa-folder-open"></i> ${sec} (${items.length})</span></div>`;
                const grid = document.createElement('div');
                grid.className = 'grid';
                items.forEach(item => { grid.innerHTML += renderCardHTML(item); });
                secDiv.appendChild(grid);
                container.appendChild(secDiv);
            });
        }

        function toggleForm(id) {
            document.getElementById('addForm').style.display = 'none';
            document.getElementById('editForm').style.display = 'none';
            const f = document.getElementById(id); f.style.display = f.style.display === 'block' ? 'none' : 'block';
        }
        function toggleTheme() {
            const next = document.body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            document.body.setAttribute('data-theme', next);
        }
        function toggleFocusMode() { document.body.classList.toggle('focus-mode'); }
        function filterCategory(cat, btn) { currentCategory = cat; document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active')); if (btn) btn.classList.add('active'); renderContent(); }
    </script>
</body>
</html>
